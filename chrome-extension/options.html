<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; background: #FAF8F5; color: #1F2937; }
    h2 { color: #7A4B9E; }
    label { font-weight: bold; display: block; margin-bottom: 8px; color: #1F2937; }
    input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #E5D5B5; border-radius: 5px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #7A4B9E; }
    button { padding: 10px 15px; background: #7A4B9E; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
    button:hover { background: #583377; }
    .help { font-size: 13px; color: #4B5563; background: #F0E8F5; padding: 10px; border-radius: 5px; margin-bottom: 20px; line-height: 1.5; border: 1px solid #C5A059; }
    #status { color: #7A4B9E; font-weight: bold; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h2>Cài đặt Tavy AI Scraper</h2>
  <div class="help">
    Để Bot có thể dùng AI đọc thông tin sản phẩm chuẩn xác nhất, bạn cần cung cấp 1 mã API Key miễn phí từ Google Gemini.<br><br>
    <a href="https://aistudio.google.com/app/apikey" target="_blank">Bấm vào đây để lấy API Key miễn phí</a>
  </div>
  <label for="apiKey">Nhập Gemini API Key của bạn:</label>
  <input type="text" id="apiKey" placeholder="AIzaSy...">
  <button id="saveBtn">Lưu Cài Đặt</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
