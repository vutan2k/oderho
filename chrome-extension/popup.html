<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 290px;
      padding: 14px;
      margin: 0;
      background: #FAFAFA;
      color: #1F2937;
    }
    .status-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
    }
    .status-online {
      background: #DCFCE7;
      color: #15803D;
    }
    .status-offline {
      background: #FEE2E2;
      color: #B91C1C;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-green {
      background: #22C55E;
      box-shadow: 0 0 8px #22C55E;
    }
    .dot-red {
      background: #EF4444;
      box-shadow: 0 0 8px #EF4444;
    }
    .btn-primary {
      padding: 11px 15px;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #1D4ED8;
    }
    .btn-auto {
      padding: 11px 15px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-auto:hover {
      background: #047857;
    }
    .progress-box {
      margin-top: 10px;
      padding: 10px;
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 8px;
      font-size: 12px;
      color: #1E40AF;
      display: none;
    }
    .footer {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h3 style="margin: 0; font-size: 15px; color: #1E40AF;">tavy-toolcaowed</h3>
    <span style="font-size: 10px; background: #DBEAFE; color: #1E40AF; padding: 2px 6px; border-radius: 10px; font-weight:700;">v6.0 AI Pro</span>
  </div>

  <div class="status-card">
    <span>Trạng thái Tool:</span>
    <div id="statusBadge" class="status-badge status-offline">
      <span id="statusDot" class="dot dot-red"></span>
      <span id="statusText">Đang kiểm tra...</span>
    </div>
  </div>

  <button id="scrapeBtn" class="btn-primary">⚡ Cào Dữ Liệu Trang Này</button>
  <button id="autoScrapeBtn" class="btn-auto">🔥 Tự Động Cào Top 50 Ranking</button>
  <button id="stopAutoScrapeBtn" class="btn-primary" style="background:#DC2626; margin-top:6px; display:none;">🛑 Dừng Cào Tự Động Ngay</button>

  <div id="progressBox" class="progress-box">
    <div style="font-weight:700; margin-bottom:4px;" id="progressTitle">🤖 Đang tự động quét Ranking...</div>
    <div id="progressDetail" style="font-size:11px;">Chuẩn bị lọc mã trùng...</div>
  </div>

  <div class="footer">
    <a href="#" id="optionsLink" style="color:#2563EB; text-decoration:none; font-weight:600;">⚙️ Cài đặt API Key Gemini</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
