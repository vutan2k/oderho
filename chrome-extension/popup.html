<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 270px;
      padding: 14px;
      margin: 0;
      background: #FAFAFA;
      color: #1F2937;
    }
    .status-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
    }
    .status-online {
      background: #DCFCE7;
      color: #15803D;
    }
    .status-offline {
      background: #FEE2E2;
      color: #B91C1C;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-green {
      background: #22C55E;
      box-shadow: 0 0 8px #22C55E;
    }
    .dot-red {
      background: #EF4444;
      box-shadow: 0 0 8px #EF4444;
    }
    button {
      padding: 11px 15px;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      font-size: 13px;
      transition: all 0.2s;
    }
    button:hover {
      background: #1D4ED8;
    }
    button:disabled {
      background: #9CA3AF;
      cursor: not-allowed;
    }
    .footer {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <h3 style="margin: 0; font-size: 15px; color: #1E40AF;">Tavy AI Scraper</h3>
    <span style="font-size: 10px; background: #DBEAFE; color: #1E40AF; padding: 2px 6px; border-radius: 10px; font-weight:700;">v3.4</span>
  </div>

  {/* Status Indicator */}
  <div class="status-card">
    <span>Trạng thái Tool:</span>
    <div id="statusBadge" class="status-badge status-offline">
      <span id="statusDot" class="dot dot-red"></span>
      <span id="statusText">Đang kiểm tra...</span>
    </div>
  </div>

  <button id="scrapeBtn">⚡ Cào Dữ Liệu Ngay</button>

  <div class="footer">
    <a href="#" id="optionsLink" style="color:#2563EB; text-decoration:none; font-weight:600;">⚙️ Cài đặt API Key Gemini</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
